# Modified by MrBlake for the NetBox-SLM fork: https://git.mrblake.cc/MrBlake/NetBox-SLM
# Based on ICTU/netbox_slm (Apache License 2.0). See the LICENSE and NOTICE files.
[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-slm"
dynamic = ["version"]
description = "Software Lifecycle Management Netbox Plugin"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    {name = "ICTU", email = "open-source-projects@ictu.nl"},
]
maintainers = [
    {name = "MrBlake"},
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Plugins",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dependencies = [
    "cryptography >= 41.0",
    "license-expression == 30.4.4",
]

[project.optional-dependencies]
build = [
    "build == 1.5.0",
    "setuptools == 82.0.1",
    "twine == 6.2.0",
]
ci = [
    "coverage == 7.14.3",
    "ruff == 0.15.19",
]

[project.urls]
Homepage = "https://git.mrblake.cc/MrBlake/NetBox-SLM"
Changelog = "https://git.mrblake.cc/MrBlake/NetBox-SLM/src/branch/master/CHANGELOG.md"
Issues = "https://git.mrblake.cc/MrBlake/NetBox-SLM/issues"
Upstream = "https://github.com/ICTU/netbox_slm"

[tool.setuptools.dynamic]
version = {attr = "netbox_slm.__version__"}

[tool.setuptools.packages.find]
include = ["netbox_slm"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["netbox_slm"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # Pyflakes
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
    "D104",  # https://beta.ruff.rs/docs/rules/#pydocstyle-d - don't require doc strings in __init__.py files
    "F401",  # https://beta.ruff.rs/docs/rules/#pyflakes-f - don't complain about unused imports in __init__.py files
]
"netbox_slm/migrations/*.py" = [
    "E501",  # https://beta.ruff.rs/docs/rules/line-too-long/ - don't check on Django generated migration files
]

[tool.ruff.format]
exclude = ["netbox_slm/migrations/*.py"]
